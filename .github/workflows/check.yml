name: Run code checks

on:
  pull_request:

  push:
    branches:
      - master

jobs:
  checks:
    runs-on: ubuntu-latest
    name: Check code style
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile

      - name: Check format
        shell: bash
        run: |
          pnpm run ci

  build:
    runs-on: ubuntu-latest
    name: Check if build works
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile

      - name: Build
        shell: bash
        run: |
          pnpm run build

  test:
    runs-on: ubuntu-latest
    name: Run tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile

      - name: Test
        shell: bash
        run: |
          pnpm run test
